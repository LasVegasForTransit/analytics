name: Deploy collector

on:
  push:
    branches: [main]
    paths:
      - 'apps/collector/**'
      - 'packages/analytics/src/events.ts'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-collector.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: analytics-collector-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy collector
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Install Chromium
        run: pnpm --filter @lvbt/analytics exec playwright install --with-deps chromium

      - name: Validate
        run: pnpm check

      - name: Deploy
        run: pnpm --filter @lvbt/analytics-collector exec wrangler deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Verify health
        run: curl --fail --retry 8 --retry-delay 5 https://events.lasvegasfortransit.org/health
