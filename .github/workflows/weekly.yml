name: Analytics weekly report

on:
  schedule:
    - cron: '0 14 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: read
  packages: read

concurrency:
  group: analytics-recurring-issues
  cancel-in-progress: false

jobs:
  report:
    name: Verify production and update report
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (vars.LVBT_ANALYTICS_LIVE == '1' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Build
        id: build
        run: pnpm build

      - name: Install Chromium
        run:
          pnpm --filter @lasvegasfortransit/analytics exec playwright install --with-deps chromium

      - name: Verify public sites
        id: verify
        run: |
          node packages/analytics/dist/cli/index.mjs verify https://lasvegasfortransit.org \
            --site lasvegasfortransit.org --expect present
          node packages/analytics/dist/cli/index.mjs verify https://labs.lasvegasfortransit.org \
            --site labs.lasvegasfortransit.org --expect present
          node packages/analytics/dist/cli/index.mjs verify https://fund.lasvegasfortransit.org \
            --site fund.lasvegasfortransit.org --expect present
          node packages/analytics/dist/cli/index.mjs verify https://map.lasvegasfortransit.org \
            --site map.lasvegasfortransit.org --expect present
          node packages/analytics/dist/cli/index.mjs verify https://lvwwd.org \
            --site lvwwd.org --expect present

      - name: Build reports
        id: reports
        run: |
          pnpm report --days 7 > report-7.md
          pnpm report --days 30 > report-30.md
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ANALYTICS_READ_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_READ_TOKEN }}

      - name: Prepare contribution actions from actual report outcomes
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          REPORT_OUTCOME: ${{ steps.reports.outcome }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const env = process.env;
          let healthy = [env.BUILD_OUTCOME, env.VERIFY_OUTCOME, env.REPORT_OUTCOME].every(value => value === 'success');
          const workflow = '.github/workflows/weekly.yml';
          const runUrl = `${env.GITHUB_SERVER_URL}/${env.GITHUB_REPOSITORY}/actions/runs/${env.GITHUB_RUN_ID}`;
          const date = new Date().toISOString().slice(0, 10);
          const readReport = file => {
            const text = readFileSync(file, 'utf8');
            if (!text.trim()) throw new Error(`Missing report content: ${file}`);
            return text;
          };
          let reportBody;
          let reportError;
          try { reportBody = healthy ? [
            '# Problem', '', 'People need a current view of production LVBT analytics.', '',
            '# Proposed change', '', `Review the verified seven-day and thirty-day reports updated ${date}.`, '',
            '# Additional context', '', readReport('report-7.md'), readReport('report-30.md'),
          ].join('\n') : undefined; } catch (error) { healthy = false; reportError = error.message; }
          const maintenanceBody = [
            '# Steps to reproduce', '', `Run Analytics weekly report on the default branch. Evidence: ${runUrl}.`, '',
            '# Expected behavior', '', 'The production site checks and both analytics reports succeed.', '',
            '# Actual behavior', '', healthy ? 'All verified checks and reports now pass.' :
              `Build: ${env.BUILD_OUTCOME}; public verification: ${env.VERIFY_OUTCOME}; reports: ${env.REPORT_OUTCOME}. ${reportError ?? ''}`, '',
            '# Additional context', '', `Checked ${date}. The workflow log identifies the failed command.`,
          ].join('\n');
          writeFileSync('lvbt-recurring-issues.json', JSON.stringify({
            version: 1, repository: env.GITHUB_REPOSITORY, commit: env.GITHUB_SHA,
            run: { id: env.GITHUB_RUN_ID, attempt: Number(env.GITHUB_RUN_ATTEMPT), repository: env.GITHUB_REPOSITORY,
              headSha: env.GITHUB_SHA, headBranch: env.GITHUB_REF_NAME, event: env.GITHUB_EVENT_NAME, workflow, url: runUrl },
            results: [
              { key: 'weekly-report', status: healthy ? 'open' : 'error', ...(reportBody ? { body: reportBody } : {}) },
              { key: 'weekly-maintenance', status: healthy ? 'resolved' : env.GITHUB_EVENT_NAME === 'schedule' ? 'open' : 'error', body: maintenanceBody },
            ],
          }, null, 2));
          if (reportError) { console.error(reportError); process.exitCode = 1; }
          NODE

      - name: Retain verified contribution actions
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lvbt-weekly-issues
          path: lvbt-recurring-issues.json
          if-no-files-found: error
          retention-days: 90

      - name: Preview complete recurring contributions
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node .lvbt/web-platform/packages/cli/plugins/lvbt-contributions/scripts/github-create.mjs
          recurring --input lvbt-recurring-issues.json --dry-run --json

      - name: Reconcile and verify stored recurring contributions
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node .lvbt/web-platform/packages/cli/plugins/lvbt-contributions/scripts/github-create.mjs
          recurring --input lvbt-recurring-issues.json --json
